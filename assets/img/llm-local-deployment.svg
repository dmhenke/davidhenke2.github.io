<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="llTitle llDesc">
  <title id="llTitle">Local large language model deployment</title>
  <desc id="llDesc">
    Illustration of an open-weights language model running on self-hosted hardware: a processor die holding a
    transformer stack, with the data path closed inside a local boundary rather than leaving for a cloud API.
  </desc>

  <defs>
    <radialGradient id="llBg" cx="72%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#1e1b3a" />
      <stop offset="100%" stop-color="#0d0c18" />
    </radialGradient>

    <linearGradient id="llDie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0.16" />
    </linearGradient>

    <!-- one transformer block -->
    <g id="llBlock">
      <rect x="-62" y="-13" width="124" height="26" rx="3" fill="#6366f1" fill-opacity="0.16" stroke="#a5b4fc" stroke-opacity="0.6" stroke-width="1.1" />
      <circle cx="-46" cy="0" r="2.6" fill="#c7d2fe" />
      <line x1="-38" y1="0" x2="10" y2="0" stroke="#a5b4fc" stroke-opacity="0.45" stroke-width="1.3" stroke-linecap="round" />
      <line x1="18" y1="0" x2="46" y2="0" stroke="#a5b4fc" stroke-opacity="0.28" stroke-width="1.3" stroke-linecap="round" />
    </g>

    <!-- package pin -->
    <g id="llPin">
      <rect x="-3" y="0" width="6" height="14" rx="1.5" fill="#a5b4fc" fill-opacity="0.65" />
    </g>
  </defs>

  <rect width="600" height="400" fill="url(#llBg)" />

  <!-- local boundary: the data never crosses it -->
  <rect x="28" y="28" width="544" height="344" rx="14" fill="none" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.4" stroke-dasharray="7 6" />
  <text x="44" y="52" fill="#a5b4fc" fill-opacity="0.75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">localhost &#183; no egress</text>

  <!-- processor package -->
  <g transform="translate(300,208)">
    <!-- pins -->
    <g transform="translate(0,92)">
      <use href="#llPin" transform="translate(-96,0)" />
      <use href="#llPin" transform="translate(-64,0)" />
      <use href="#llPin" transform="translate(-32,0)" />
      <use href="#llPin" transform="translate(0,0)" />
      <use href="#llPin" transform="translate(32,0)" />
      <use href="#llPin" transform="translate(64,0)" />
      <use href="#llPin" transform="translate(96,0)" />
    </g>
    <g transform="translate(0,-106) rotate(180)">
      <use href="#llPin" transform="translate(-96,0)" />
      <use href="#llPin" transform="translate(-64,0)" />
      <use href="#llPin" transform="translate(-32,0)" />
      <use href="#llPin" transform="translate(0,0)" />
      <use href="#llPin" transform="translate(32,0)" />
      <use href="#llPin" transform="translate(64,0)" />
      <use href="#llPin" transform="translate(96,0)" />
    </g>

    <rect x="-118" y="-106" width="236" height="198" rx="10" fill="url(#llDie)" stroke="#a5b4fc" stroke-opacity="0.7" stroke-width="1.6" />
    <rect x="-100" y="-88" width="200" height="162" rx="6" fill="none" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />

    <!-- transformer stack -->
    <use href="#llBlock" transform="translate(0,-58)" />
    <use href="#llBlock" transform="translate(0,-22)" />
    <use href="#llBlock" transform="translate(0,14)" />
    <use href="#llBlock" transform="translate(0,50)" />

    <!-- residual path down the stack -->
    <g stroke="#c7d2fe" stroke-opacity="0.5" stroke-width="1.2" fill="none" stroke-linecap="round">
      <path d="M-78 -45 L-78 -35" />
      <path d="M-78 -9 L-78 1" />
      <path d="M-78 27 L-78 37" />
    </g>
  </g>

  <!-- prompt in -->
  <g transform="translate(96,208)">
    <rect x="-42" y="-18" width="84" height="36" rx="4" fill="#6366f1" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.6" stroke-width="1.2" />
    <line x1="-30" y1="-6" x2="18" y2="-6" stroke="#c7d2fe" stroke-opacity="0.65" stroke-width="1.6" stroke-linecap="round" />
    <line x1="-30" y1="1" x2="28" y2="1" stroke="#c7d2fe" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round" />
    <line x1="-30" y1="8" x2="6" y2="8" stroke="#c7d2fe" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round" />
  </g>
  <path d="M140 208 L178 208" stroke="#a5b4fc" stroke-opacity="0.7" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <path d="M170 202 L178 208 L170 214" stroke="#a5b4fc" stroke-opacity="0.9" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />

  <!-- token stream out -->
  <path d="M422 208 L458 208" stroke="#a5b4fc" stroke-opacity="0.7" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <g fill="#c7d2fe">
    <circle cx="474" cy="208" r="4" fill-opacity="0.95" />
    <circle cx="494" cy="208" r="4" fill-opacity="0.7" />
    <circle cx="514" cy="208" r="4" fill-opacity="0.45" />
    <circle cx="534" cy="208" r="4" fill-opacity="0.22" />
  </g>

  <text x="44" y="356" fill="#a5b4fc" fill-opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">open weights &#183; your hardware &#183; your data</text>
</svg>
