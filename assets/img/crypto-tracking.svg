<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="cryptoTitle cryptoDesc">
  <title id="cryptoTitle">Crypto Tracking</title>
  <desc id="cryptoDesc">
    Daily candlesticks of a coin price with a fund's price tracking it as a dotted line,
    and a small premium-or-discount band beneath: crypto prices compared with the spot funds that hold them.
  </desc>

  <defs>
    <radialGradient id="cryBg" cx="74%" cy="16%" r="98%">
      <stop offset="0%" stop-color="#0f3330" />
      <stop offset="100%" stop-color="#0a1315" />
    </radialGradient>
    <radialGradient id="cryGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#2dd4bf" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cryArea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#cryBg)" />

  <!-- grid -->
  <g stroke="#99f6e4" stroke-opacity="0.08" stroke-width="1">
    <line x1="60" y1="90" x2="560" y2="90" />
    <line x1="60" y1="150" x2="560" y2="150" />
    <line x1="60" y1="210" x2="560" y2="210" />
    <line x1="60" y1="270" x2="560" y2="270" />
  </g>

  <!-- coin glow, top right -->
  <circle cx="478" cy="96" r="92" fill="url(#cryGlow)" />
  <circle cx="478" cy="96" r="26" fill="none" stroke="#d1fae5" stroke-opacity="0.9" stroke-width="3" />
  <circle cx="478" cy="96" r="18" fill="#d1fae5" fill-opacity="0.15" />

  <!-- area under the close -->
  <path d="M80,232 L120,220 L160,238 L200,206 L240,214 L280,186 L320,196 L360,166 L400,178 L440,150 L480,162 L520,132 L520,290 L80,290 Z" fill="url(#cryArea)" />

  <!-- candlesticks: rising = hollow teal, falling = solid -->
  <g stroke="#5eead4" stroke-width="2" stroke-linecap="round">
    <line x1="80" y1="218" x2="80" y2="250" /><rect x="72" y="226" width="16" height="16" fill="#0d9488" />
    <line x1="120" y1="206" x2="120" y2="240" /><rect x="112" y="214" width="16" height="16" fill="none" />
    <line x1="160" y1="222" x2="160" y2="254" /><rect x="152" y="230" width="16" height="14" fill="#0d9488" />
    <line x1="200" y1="192" x2="200" y2="236" /><rect x="192" y="202" width="16" height="26" fill="none" />
    <line x1="240" y1="200" x2="240" y2="230" /><rect x="232" y="208" width="16" height="12" fill="#0d9488" />
    <line x1="280" y1="170" x2="280" y2="214" /><rect x="272" y="180" width="16" height="26" fill="none" />
    <line x1="320" y1="182" x2="320" y2="212" /><rect x="312" y="188" width="16" height="14" fill="#0d9488" />
    <line x1="360" y1="150" x2="360" y2="196" /><rect x="352" y="160" width="16" height="28" fill="none" />
    <line x1="400" y1="164" x2="400" y2="194" /><rect x="392" y="170" width="16" height="14" fill="#0d9488" />
    <line x1="440" y1="134" x2="440" y2="182" /><rect x="432" y="144" width="16" height="28" fill="none" />
    <line x1="480" y1="148" x2="480" y2="178" /><rect x="472" y="154" width="16" height="14" fill="#0d9488" />
    <line x1="520" y1="118" x2="520" y2="164" /><rect x="512" y="126" width="16" height="28" fill="none" />
  </g>

  <!-- fund tracking the coin (dotted) -->
  <polyline points="80,240 120,228 160,246 200,214 240,222 280,194 320,204 360,174 400,186 440,158 480,170 520,140"
            fill="none" stroke="#e8e8e8" stroke-opacity="0.75" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round" />

  <!-- premium / discount band -->
  <line x1="60" y1="330" x2="560" y2="330" stroke="#99f6e4" stroke-opacity="0.25" stroke-width="1" />
  <path d="M80,352 C140,350 180,346 220,340 C250,336 262,331 280,330 C340,329 420,331 520,330"
        fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" />
  <text x="560" y="322" text-anchor="end" font-family="JetBrains Mono, monospace" font-size="12" fill="#99f6e4" fill-opacity="0.6">premium 0%</text>
</svg>
