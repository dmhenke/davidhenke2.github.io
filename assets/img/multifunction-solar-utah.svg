<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="solarTitle solarDesc">
  <title id="solarTitle">Multifunction solar on Utah's public waters</title>
  <desc id="solarDesc">
    Illustration of floating photovoltaic arrays moored on a reservoir beneath the Wasatch Range,
    with a playa-sited ground-mount array on the far shore: solar generation paired with
    evaporative-loss suppression, dust control, and ecosystem protection.
  </desc>

  <defs>
    <radialGradient id="solBg" cx="74%" cy="16%" r="98%">
      <stop offset="0%" stop-color="#0f3330" />
      <stop offset="100%" stop-color="#0a1315" />
    </radialGradient>

    <radialGradient id="solSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#2dd4bf" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="solWater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f766e" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#062024" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="solPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="solRidge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#0a2325" />
    </linearGradient>

    <linearGradient id="solPlaya" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3a38" />
      <stop offset="100%" stop-color="#0d2226" />
    </linearGradient>

    <!-- One floating PV raft, drawn in plan-oblique -->
    <g id="solRaft">
      <polygon points="0,0 46,0 38,13 -8,13" fill="url(#solPanel)" stroke="#99f6e4" stroke-width="0.9" stroke-opacity="0.7" />
      <line x1="11.5" y1="0" x2="3.5" y2="13" stroke="#0a1315" stroke-width="0.7" stroke-opacity="0.5" />
      <line x1="23" y1="0" x2="15" y2="13" stroke="#0a1315" stroke-width="0.7" stroke-opacity="0.5" />
      <line x1="34.5" y1="0" x2="26.5" y2="13" stroke="#0a1315" stroke-width="0.7" stroke-opacity="0.5" />
    </g>
  </defs>

  <rect width="600" height="400" fill="url(#solBg)" />

  <!-- Sun / insolation glow -->
  <circle cx="466" cy="86" r="128" fill="url(#solSun)" />
  <circle cx="466" cy="86" r="21" fill="#d1fae5" fill-opacity="0.92" />

  <!-- Wasatch ridgeline -->
  <path d="M0,196 L64,150 L108,176 L162,118 L214,168 L262,140 L318,182 L372,152 L430,190 L486,164 L544,192 L600,170 L600,232 L0,232 Z"
        fill="url(#solRidge)" />
  <path d="M162,118 L182,136 L162,142 L146,134 Z" fill="#a7f3d0" fill-opacity="0.55" />
  <path d="M64,150 L78,162 L64,166 L52,160 Z" fill="#a7f3d0" fill-opacity="0.35" />

  <!-- Far shore playa with ground-mount array -->
  <path d="M0,232 L600,232 L600,262 L0,262 Z" fill="url(#solPlaya)" />
  <g stroke="#5eead4" stroke-opacity="0.75" stroke-width="2.2" stroke-linecap="round">
    <line x1="356" y1="252" x2="374" y2="244" />
    <line x1="386" y1="252" x2="404" y2="244" />
    <line x1="416" y1="252" x2="434" y2="244" />
    <line x1="446" y1="252" x2="464" y2="244" />
    <line x1="476" y1="252" x2="494" y2="244" />
    <line x1="506" y1="252" x2="524" y2="244" />
    <line x1="536" y1="252" x2="554" y2="244" />
  </g>
  <g stroke="#5eead4" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round">
    <line x1="366" y1="240" x2="382" y2="233" />
    <line x1="394" y1="240" x2="410" y2="233" />
    <line x1="422" y1="240" x2="438" y2="233" />
    <line x1="450" y1="240" x2="466" y2="233" />
    <line x1="478" y1="240" x2="494" y2="233" />
    <line x1="506" y1="240" x2="522" y2="233" />
  </g>

  <!-- Reservoir surface -->
  <path d="M0,262 L600,262 L600,400 L0,400 Z" fill="url(#solWater)" />

  <!-- Suppressed-evaporation vapour cues rising outside the array footprint -->
  <g stroke="#a7f3d0" stroke-opacity="0.28" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M44,300 C50,290 38,284 44,274" />
    <path d="M74,318 C80,308 68,302 74,292" />
    <path d="M552,306 C558,296 546,290 552,280" />
    <path d="M520,332 C526,322 514,316 520,306" />
  </g>

  <!-- Moored floating PV blocks -->
  <g opacity="0.96">
    <use href="#solRaft" x="196" y="278" />
    <use href="#solRaft" x="252" y="278" />
    <use href="#solRaft" x="308" y="278" />
    <use href="#solRaft" x="364" y="278" />

    <use href="#solRaft" x="168" y="304" transform="scale(1.08) translate(-12,-22)" />
    <use href="#solRaft" x="232" y="304" transform="scale(1.08) translate(-12,-22)" />
    <use href="#solRaft" x="296" y="304" transform="scale(1.08) translate(-12,-22)" />
    <use href="#solRaft" x="360" y="304" transform="scale(1.08) translate(-12,-22)" />

    <use href="#solRaft" x="132" y="336" transform="scale(1.18) translate(-24,-48)" />
    <use href="#solRaft" x="204" y="336" transform="scale(1.18) translate(-24,-48)" />
    <use href="#solRaft" x="276" y="336" transform="scale(1.18) translate(-24,-48)" />
    <use href="#solRaft" x="348" y="336" transform="scale(1.18) translate(-24,-48)" />
  </g>

  <!-- Mooring lines to shore anchors -->
  <g stroke="#2dd4bf" stroke-opacity="0.35" stroke-width="1.1">
    <line x1="188" y1="282" x2="126" y2="266" />
    <line x1="418" y1="282" x2="482" y2="266" />
    <line x1="140" y1="372" x2="72" y2="392" />
    <line x1="452" y1="372" x2="528" y2="392" />
  </g>

  <!-- Waterline highlight -->
  <line x1="0" y1="262" x2="600" y2="262" stroke="#5eead4" stroke-opacity="0.5" stroke-width="1.4" />
</svg>
