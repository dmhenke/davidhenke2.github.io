<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="d2dTitle d2dDesc">
  <title id="d2dTitle">Drug-to-disease signature reversal</title>
  <desc id="d2dDesc">
    Schematic of transcriptional signature reversal: a disease gene-expression signature (bars up and down)
    is matched to a compound signature that mirrors it in the opposite direction, nominating a candidate drug.
  </desc>

  <defs>
    <radialGradient id="d2dBg" cx="72%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#1e2a44" />
      <stop offset="100%" stop-color="#0b1020" />
    </radialGradient>
    <marker id="d2dArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#cbd5e1" />
    </marker>
  </defs>

  <rect width="600" height="400" fill="url(#d2dBg)" />

  <!-- Baselines -->
  <line x1="60" y1="200" x2="260" y2="200" stroke="#64748b" stroke-width="1.5" />
  <line x1="340" y1="200" x2="540" y2="200" stroke="#64748b" stroke-width="1.5" />

  <!-- Disease signature (coral): up/down genes -->
  <g fill="#f87171">
    <rect x="70"  y="110" width="16" height="90" rx="2" />
    <rect x="94"  y="140" width="16" height="60" rx="2" />
    <rect x="118" y="200" width="16" height="70" rx="2" />
    <rect x="142" y="125" width="16" height="75" rx="2" />
    <rect x="166" y="200" width="16" height="45" rx="2" />
    <rect x="190" y="200" width="16" height="85" rx="2" />
    <rect x="214" y="160" width="16" height="40" rx="2" />
    <rect x="238" y="200" width="16" height="30" rx="2" />
  </g>

  <!-- Compound signature (teal): mirror image -->
  <g fill="#2dd4bf">
    <rect x="350" y="200" width="16" height="85" rx="2" />
    <rect x="374" y="200" width="16" height="55" rx="2" />
    <rect x="398" y="135" width="16" height="65" rx="2" />
    <rect x="422" y="200" width="16" height="70" rx="2" />
    <rect x="446" y="158" width="16" height="42" rx="2" />
    <rect x="470" y="120" width="16" height="80" rx="2" />
    <rect x="494" y="200" width="16" height="38" rx="2" />
    <rect x="518" y="172" width="16" height="28" rx="2" />
  </g>

  <!-- Reversal arrow -->
  <path d="M272,200 C290,170 310,170 328,200" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#d2dArrow)" />
  <path d="M328,200 C310,230 290,230 272,200" fill="none" stroke="#cbd5e1" stroke-width="2.5" marker-end="url(#d2dArrow)" />

  <!-- Labels -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="162" y="62" font-size="20" font-weight="600" fill="#fca5a5">Disease signature</text>
    <text x="162" y="84" font-size="14" fill="#94a3b8">SLE monocytes</text>
    <text x="442" y="62" font-size="20" font-weight="600" fill="#5eead4">Compound signature</text>
    <text x="442" y="84" font-size="14" fill="#94a3b8">LINCS L1000</text>
    <text x="300" y="350" font-size="17" fill="#e2e8f0">reverse the state, nominate the drug</text>
  </g>
</svg>
