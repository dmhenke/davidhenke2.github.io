<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="lcTitle lcDesc">
  <title id="lcTitle">Language models in a hosted notebook</title>
  <desc id="lcDesc">
    Illustration of running a large language model inside a hosted notebook environment: executable notebook
    cells on the left attached to a remote GPU accelerator on the right, requiring no local installation.
  </desc>

  <defs>
    <radialGradient id="lcBg" cx="72%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#0b2f3a" />
      <stop offset="100%" stop-color="#08161b" />
    </radialGradient>

    <linearGradient id="lcGpu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.26" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.14" />
    </linearGradient>

    <!-- an executed notebook cell -->
    <g id="lcCell">
      <rect x="0" y="-19" width="176" height="38" rx="4" fill="#0891b2" fill-opacity="0.14" stroke="#67e8f9" stroke-opacity="0.5" stroke-width="1.1" />
      <rect x="0" y="-19" width="3.5" height="38" rx="1.75" fill="#67e8f9" fill-opacity="0.9" />
      <line x1="16" y1="-8" x2="100" y2="-8" stroke="#a5f3fc" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" />
      <line x1="16" y1="-1" x2="136" y2="-1" stroke="#a5f3fc" stroke-opacity="0.38" stroke-width="1.5" stroke-linecap="round" />
      <line x1="16" y1="6" x2="78" y2="6" stroke="#a5f3fc" stroke-opacity="0.38" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </defs>

  <rect width="600" height="400" fill="url(#lcBg)" />

  <!-- notebook -->
  <g transform="translate(48,0)">
    <rect x="0" y="52" width="228" height="300" rx="10" fill="#08161b" fill-opacity="0.7" stroke="#22d3ee" stroke-opacity="0.4" stroke-width="1.3" />
    <!-- toolbar -->
    <g fill="#67e8f9">
      <circle cx="20" cy="72" r="3.6" fill-opacity="0.85" />
      <circle cx="33" cy="72" r="3.6" fill-opacity="0.5" />
      <circle cx="46" cy="72" r="3.6" fill-opacity="0.3" />
    </g>
    <line x1="0" y1="88" x2="228" y2="88" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1" />

    <use href="#lcCell" transform="translate(40,124)" />
    <use href="#lcCell" transform="translate(40,186)" />
    <use href="#lcCell" transform="translate(40,248)" />
    <use href="#lcCell" transform="translate(40,310)" />

    <!-- run markers -->
    <g fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" text-anchor="end" fill-opacity="0.75">
      <text x="32" y="128">[1]</text>
      <text x="32" y="190">[2]</text>
      <text x="32" y="252">[3]</text>
      <text x="32" y="314">[4]</text>
    </g>
  </g>

  <!-- runtime link -->
  <g stroke="#67e8f9" stroke-opacity="0.65" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M290 202 L346 202" stroke-dasharray="6 5" />
    <path d="M338 196 L346 202 L338 208" stroke-dasharray="0" />
  </g>
  <text x="290" y="188" fill="#a5f3fc" fill-opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">runtime</text>

  <!-- GPU accelerator -->
  <g transform="translate(452,202)">
    <rect x="-90" y="-84" width="180" height="168" rx="10" fill="url(#lcGpu)" stroke="#67e8f9" stroke-opacity="0.7" stroke-width="1.6" />
    <rect x="-72" y="-66" width="144" height="132" rx="6" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1" />

    <!-- parallel compute lanes -->
    <g>
      <rect x="-56" y="-48" width="112" height="16" rx="2" fill="#22d3ee" fill-opacity="0.22" />
      <rect x="-56" y="-24" width="112" height="16" rx="2" fill="#22d3ee" fill-opacity="0.3" />
      <rect x="-56" y="0" width="112" height="16" rx="2" fill="#22d3ee" fill-opacity="0.4" />
      <rect x="-56" y="24" width="112" height="16" rx="2" fill="#22d3ee" fill-opacity="0.3" />
      <rect x="-56" y="48" width="112" height="16" rx="2" fill="#22d3ee" fill-opacity="0.22" />
    </g>

    <!-- lane dividers imply many cores per lane -->
    <g stroke="#08161b" stroke-opacity="0.75" stroke-width="1.5">
      <line x1="-28" y1="-48" x2="-28" y2="64" />
      <line x1="0" y1="-48" x2="0" y2="64" />
      <line x1="28" y1="-48" x2="28" y2="64" />
    </g>

    <text x="0" y="-96" fill="#a5f3fc" fill-opacity="0.85" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle">GPU</text>
  </g>

  <text x="48" y="382" fill="#67e8f9" fill-opacity="0.7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">hosted notebook &#183; free GPU &#183; zero local setup</text>
</svg>
